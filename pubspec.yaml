name: iranshahr_plate
description: "Bahrain's, Azerbaijan's, Afghanistan's, Armenia's, Tajikistan's, Kuwait's, Qatar's, Iraq's, the UAE's, Turkey's, Oman's, Turkmenistan's, Uzbekistan's and Kazakhstan's licence plates for the plate_core library — country panels, and the Bahraini, Azerbaijani, Afghan, Armenian, Tajik, Kuwaiti, Qatari, Iraqi, Emirati, Turkish, Omani, Turkmen, Uzbek and Kazakh plate specs."
version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/iranshahr_plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  # Shared alphabet definitions.
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/flags/Flag_of_Bahrain.svg
    - assets/flags/Flag_of_Azerbaijan.svg
    - assets/flags/Flag_of_Armenia.svg
    - assets/flags/Flag_of_Tajikistan.svg
    - assets/flags/Flag_of_Uzbekistan.svg
    - assets/icons/turkmenistan_flag.svg
    - assets/icons/turkmenistan_flag.png
    - assets/icons/turkmenistan_strip.png
    - assets/icons/turkmenistan_crescent.png
    - assets/icons/kazakhstan_flag.svg
    - assets/icons/kazakhstan_flag.png

    # Afghanistan ships an emblem rather than a flag: the block at the hoist
    # end of an Afghan plate carries the Darul Aman Palace, not the national
    # colours. Two files, one per ink — see `AfghanistanPanelInk`.
    - assets/emblems/Darul_Aman_dark.svg
    - assets/emblems/Darul_Aman_light.svg
