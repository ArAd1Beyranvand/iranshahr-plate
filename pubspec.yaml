name: iranshahr_plate
description: "Licence plates of Bahrain, Azerbaijan, Afghanistan, Armenia, Tajikistan, Kuwait, Qatar, Iraq, UAE, Turkey, Oman, Turkmenistan, Uzbekistan and Kazakhstan for plate_core."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/iranshahr-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  # Shared alphabet definitions.
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/flags/Flag_of_Tajikistan.svg
    - assets/icons/turkmenistan_flag.svg
    - assets/icons/turkmenistan_flag.png
    - assets/icons/turkmenistan_strip.png
    - assets/icons/turkmenistan_crescent.png
    - assets/icons/kazakhstan_flag.svg
    - assets/icons/kazakhstan_flag.png

    # Afghanistan ships an emblem rather than a flag: the block at the hoist
    # end of an Afghan plate carries the Darul Aman Palace, not the national
    # colours. Two files, one per ink — see `AfghanistanPanelInk`.
    - assets/emblems/Darul_Aman_dark.svg
    - assets/emblems/Darul_Aman_light.svg
