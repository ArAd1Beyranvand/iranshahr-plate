name: iranshahr
description: "Bahrain's and Azerbaijan's licence plates for the core_plate library — country panels, and the Bahraini and Azerbaijani plate specs."
version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/iranshahr

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_plate: ^0.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/flags/Flag_of_Bahrain.svg
    - assets/flags/Flag_of_Azerbaijan.svg
