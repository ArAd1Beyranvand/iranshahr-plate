name: iranshahr_plate
description: "Bahrain's, Azerbaijan's, Afghanistan's, Armenia's, Tajikistan's, Kuwait's, Qatar's, Iraq's and the UAE's licence plates for the core_plate library — country panels, and the Bahraini, Azerbaijani, Afghan, Armenian, Tajik, Kuwaiti, Qatari, Iraqi and Emirati plate specs."
version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/iranshahr_plate

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_plate: ^0.11.0
  # Shared alphabet definitions.
  plate_alphabet:
    path: ../plate_alphabet

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/flags/Flag_of_Bahrain.svg
    - assets/flags/Flag_of_Azerbaijan.svg
    - assets/flags/Flag_of_Armenia.svg
    - assets/flags/Flag_of_Tajikistan.svg

    # Afghanistan ships an emblem rather than a flag: the block at the hoist
    # end of an Afghan plate carries the Darul Aman Palace, not the national
    # colours. Two files, one per ink — see `AfghanistanPanelInk`.
    - assets/emblems/Darul_Aman_dark.svg
    - assets/emblems/Darul_Aman_light.svg
